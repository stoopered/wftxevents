<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sunday Bookings | WFTX Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0b0906; --card: #1c1610; --border: #33291d; --text: #e9e2d6; --dim: #a99f8f; --glow: #39ff14; --red: #b3221f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Special Elite', 'Courier New', monospace; padding: 20px; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 1.4rem; }
  a { color: var(--glow); }
  h2 { font-size: 1.1rem; color: var(--glow); margin: 28px 0 8px; }
  input, button { font: inherit; padding: 8px 12px; background: #0f0c08; color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  button { cursor: pointer; }
  button.danger { border-color: var(--red); color: var(--red); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--dim); font-weight: normal; }
  tr.cancelled td { color: var(--dim); text-decoration: line-through; }
  .msg { color: var(--red); min-height: 1.4em; }
  .summary { color: var(--dim); font-size: 0.9rem; }
  @media (max-width: 720px) { th:nth-child(6), td:nth-child(6) { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sunday Bookings</h1>
  <div class="row">
    <input type="password" id="token" placeholder="Admin token" size="40" autocomplete="off">
    <button id="load">Load</button>
    <button id="forget">Forget token</button>
    <span class="msg" id="msg"></span>
  </div>
  <div id="out"></div>
</div>

<script>
const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? 'http://127.0.0.1:8787'
  : 'https://wftxevents-booking.michael-b-rehkemper.workers.dev';
const tokenInput = document.getElementById('token');
const out = document.getElementById('out');
const msg = document.getElementById('msg');

tokenInput.value = sessionStorage.getItem('adminToken') || '';

async function api(path, init = {}) {
  const res = await fetch(API_BASE + path, { ...init, headers: { Authorization: 'Bearer ' + tokenInput.value, ...(init.headers || {}) } });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function load() {
  msg.textContent = '';
  out.innerHTML = '';
  if (!tokenInput.value) { msg.textContent = 'Enter the admin token.'; return; }
  sessionStorage.setItem('adminToken', tokenInput.value);
  let bookings;
  try { ({ bookings } = await api('/api/admin/bookings')); }
  catch (e) { msg.textContent = e.message; return; }

  if (!bookings.length) { out.innerHTML = '<p class="summary">No bookings yet.</p>'; return; }

  const byDate = {};
  for (const b of bookings) (byDate[b.date] ||= []).push(b);

  for (const [date, list] of Object.entries(byDate)) {
    const confirmed = list.filter((b) => b.status === 'confirmed');
    const people = confirmed.reduce((n, b) => n + b.party, 0);
    const kids = confirmed.reduce((n, b) => n + b.kids, 0);
    out.insertAdjacentHTML('beforeend', `
      <h2>${esc(list[0].dateLabel)}</h2>
      <p class="summary">${confirmed.length} group${confirmed.length === 1 ? '' : 's'} · ${people} people · ${kids} glow band${kids === 1 ? '' : 's'}</p>
      <table>
        <tr><th>Time</th><th>Code</th><th>Name</th><th>Group</th><th>Contact</th><th>Notes</th><th></th></tr>
        ${list.map((b) => `
          <tr class="${esc(b.status)}">
            <td>${esc(b.timeLabel)}</td>
            <td>${esc(b.code)}</td>
            <td>${esc(b.name)}</td>
            <td>${b.party}${b.kids ? ` (${b.kids} kids)` : ''}</td>
            <td>${esc(b.phone)}<br><a href="mailto:${esc(b.email)}">${esc(b.email)}</a></td>
            <td>${esc(b.notes)}</td>
            <td>${b.status === 'confirmed' ? `<button class="danger" data-id="${esc(b.id)}">Cancel</button>` : 'cancelled'}</td>
          </tr>`).join('')}
      </table>`);
  }
}

out.addEventListener('click', async (e) => {
  const id = e.target.dataset.id;
  if (!id || !confirm('Cancel this booking?')) return;
  try { await api('/api/admin/bookings/' + id, { method: 'DELETE' }); load(); }
  catch (err) { msg.textContent = err.message; }
});

document.getElementById('load').addEventListener('click', load);
document.getElementById('forget').addEventListener('click', () => { sessionStorage.removeItem('adminToken'); tokenInput.value = ''; out.innerHTML = ''; });
tokenInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(); });
if (tokenInput.value) load();
</script>
</body>
</html>
