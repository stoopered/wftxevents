name: Deploy booking API (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: 5d3e356815fa558bc52164ed77897f54
          workingDirectory: worker
          command: d1 migrations apply wftxevents-bookings --remote

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        env:
          ADMIN_TOKEN: ${{ secrets.BOOKING_ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAILS: ${{ secrets.BOOKING_NOTIFY_EMAILS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
          accountId: 5d3e356815fa558bc52164ed77897f54
          workingDirectory: worker
          command: deploy
          secrets: |
            ADMIN_TOKEN
            RESEND_API_KEY
            NOTIFY_EMAILS
            NTFY_TOPIC
