name: Terraform - Cloudflare DNS

# Plans on every push that touches the stack; applies only on a manual run
# with apply=true. Runs on GitHub-hosted runners -- Cloudflare's API uses a
# scoped token, not an IP allowlist. State is in R2 (see versions.tf).
on:
  push:
    branches: [main]
    paths:
      - 'terraform/cloudflare-dns/**'
      - '.github/workflows/terraform-cloudflare-dns.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply the plan (unchecked = plan only)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: terraform-cloudflare-dns
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/cloudflare-dns
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.3"

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: terraform apply -input=false -auto-approve tfplan
